<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>maple's Apps — iOS Developer</title>
  <link rel="stylesheet" href="css/style.css" />

<body>
  <div class="container">

    <header>
      <a href="/" class="logo">maple</a>
      <nav class="header-nav">
